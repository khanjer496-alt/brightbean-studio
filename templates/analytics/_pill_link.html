<a href="{{ url }}"{% if title %} title="{{ title }}"{% endif %}{% if on %} aria-current="true"{% endif %}
   {% if hx_url %}hx-get="{{ hx_url }}" hx-target="{{ hx_target }}" hx-swap="outerHTML"{% endif %}
   class="inline-flex min-h-8 items-center rounded-full px-3.5 py-1 text-[13px] font-semibold no-underline {% if on %}bg-surface-3 text-ink shadow-xs{% else %}text-ink-3 hover:text-ink{% endif %}">{{ label }}</a>
