{% load analytics_extras %}
{# Line chart with its text equivalents. Needs chart_id, chart ({labels, datasets, kind}) and summary. #}
<figure class="m-0">
    {% if chart.datasets|length > 1 %}
    <ul class="m-0 mb-3 flex list-none flex-wrap gap-x-4 gap-y-1 p-0 text-xs text-ink-2">
        {% for ds in chart.datasets %}
        <li class="inline-flex items-center gap-1.5">{% include "analytics/_swatch.html" with n=forloop.counter muted=ds.muted %}{{ ds.label }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <div class="relative h-64 w-full overflow-hidden">
        <canvas data-chart="{{ chart_id }}" role="img" aria-label="{{ summary }}" class="absolute inset-0"></canvas>
    </div>
    {{ chart|json_script:chart_id }}
    <figcaption class="mt-2 text-xs text-ink-3">{{ summary }}</figcaption>
    <details class="mt-2">
        <summary class="cursor-pointer text-xs font-semibold text-ink-2">View data as a table</summary>
        <div class="mt-2 max-h-72 overflow-auto rounded-lg border border-line">
            <table class="w-full border-collapse text-xs">
                <caption class="sr-only">{{ chart.label }} by day</caption>
                <thead class="sticky top-0 bg-surface-2">
                    <tr>
                        <th scope="col" class="px-3 py-2 text-left font-semibold text-ink-3">Date</th>
                        {% for ds in chart.datasets %}<th scope="col" class="px-3 py-2 text-right font-semibold text-ink-3">{{ ds.label }}</th>{% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for day, values in chart|chart_rows %}
                    <tr class="border-t border-line">
                        <th scope="row" class="px-3 py-1.5 text-left font-normal text-ink-2">{{ day }}</th>
                        {% for v in values %}<td class="px-3 py-1.5 text-right font-mono text-ink-2">{% if v is None %}No data{% elif chart.kind == "percent" %}{{ v|floatformat:1 }}%{% else %}{{ v|floatformat:"0g" }}{% endif %}</td>{% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </details>
</figure>
