{% load humanize %}
<!-- Filter bar -->
<div role="search" aria-label="Filter messages" class="px-4 py-2.5 border-b border-stone-100 bg-surface-1 flex items-center gap-2 flex-wrap flex-shrink-0">
    <!-- Search -->
    <div class="relative flex-1 min-w-[160px]">
        <svg aria-hidden="true" class="absolute start-2.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-stone-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search"
               name="q" aria-label="Search messages"
               value="{{ active_filters.q|default:'' }}"
               placeholder="Search messages..."
               class="w-full ps-8 pe-3 py-1.5 text-[12px] bg-white border border-stone-200 rounded-md transition-all"
               hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}"
               hx-target="#inbox-message-list"
               hx-swap="innerHTML"
               hx-trigger="keyup changed delay:400ms"
               hx-include="[name='rating'],[name='needs_reply']:checked,[name='platform'],[name='type'],[name='status'],[name='sentiment']">
    </div>

    <!-- Platform filter -->
    <select name="platform" class="filter-select" aria-label="Filter by platform"
            hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}"
            hx-target="#inbox-message-list"
            hx-swap="innerHTML"
            hx-include="[name='rating'],[name='needs_reply']:checked,[name='q'],[name='type'],[name='status'],[name='sentiment']">
        <option value="">All platforms</option>
        {% for account in social_accounts %}
        <option value="{{ account.platform }}" {% if account.platform in active_filters.platform %}selected{% endif %}>{% if account.platform == "youtube" %}YouTube{% else %}{{ account.get_platform_display|default:account.platform|title }}{% endif %}</option>
        {% endfor %}
    </select>

    <!-- Type filter -->
    <select name="type" class="filter-select" aria-label="Filter by message type"
            hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}"
            hx-target="#inbox-message-list"
            hx-swap="innerHTML"
            hx-include="[name='rating'],[name='needs_reply']:checked,[name='q'],[name='platform'],[name='status'],[name='sentiment']">
        <option value="">All types</option>
        <option value="comment" {% if 'comment' in active_filters.type %}selected{% endif %}>Comments</option>
        <option value="mention" {% if 'mention' in active_filters.type %}selected{% endif %}>Mentions</option>
        <option value="dm" {% if 'dm' in active_filters.type %}selected{% endif %}>DMs</option>
        <option value="review" {% if 'review' in active_filters.type %}selected{% endif %}>Reviews</option>
    </select>

    <!-- Status filter -->
    <select name="status" class="filter-select" aria-label="Filter by status"
            hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}"
            hx-target="#inbox-message-list"
            hx-swap="innerHTML"
            hx-include="[name='rating'],[name='needs_reply']:checked,[name='q'],[name='platform'],[name='type'],[name='sentiment']">
        <option value="">All statuses</option>
        <option value="unread" {% if 'unread' in active_filters.status %}selected{% endif %}>Unread</option>
        <option value="open" {% if 'open' in active_filters.status %}selected{% endif %}>Open</option>
        <option value="resolved" {% if 'resolved' in active_filters.status %}selected{% endif %}>Resolved</option>
        <option value="archived" {% if 'archived' in active_filters.status %}selected{% endif %}>Archived</option>
    </select>

    <!-- Sentiment filter -->
    <select name="sentiment" class="filter-select" aria-label="Filter by sentiment"
            hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}"
            hx-target="#inbox-message-list"
            hx-swap="innerHTML"
            hx-include="[name='rating'],[name='needs_reply']:checked,[name='q'],[name='platform'],[name='type'],[name='status']">
        <option value="">All sentiment</option>
        <option value="positive" {% if 'positive' in active_filters.sentiment %}selected{% endif %}>Positive</option>
        <option value="neutral" {% if 'neutral' in active_filters.sentiment %}selected{% endif %}>Neutral</option>
        <option value="negative" {% if 'negative' in active_filters.sentiment %}selected{% endif %}>Negative</option>
    </select>
    <!-- Star rating filter (reviews) -->
    <select name="rating" class="filter-select" aria-label="Filter reviews by stars"
            hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}"
            hx-target="#inbox-message-list"
            hx-swap="innerHTML"
            hx-include="[name='needs_reply']:checked,[name='q'],[name='platform'],[name='type'],[name='status'],[name='sentiment']">
        <option value="">Any stars</option>
        {% for stars in "54321" %}
        <option value="{{ stars }}" {% if stars in active_filters.rating %}selected{% endif %}>{{ stars }} star{{ stars|pluralize:"" }}</option>
        {% endfor %}
    </select>

    <!-- Reviews without a public reply -->
    <label class="flex items-center gap-1.5 text-[12px] text-stone-600 cursor-pointer">
        <input type="checkbox" name="needs_reply" value="1" {% if active_filters.needs_reply %}checked{% endif %}
               class="w-3.5 h-3.5 rounded border-stone-300 text-orange-500 focus:ring-orange-200"
               hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}"
               hx-target="#inbox-message-list"
               hx-swap="innerHTML"
               hx-include="[name='rating'],[name='q'],[name='platform'],[name='type'],[name='status'],[name='sentiment']">
        Needs reply
    </label>
</div>
