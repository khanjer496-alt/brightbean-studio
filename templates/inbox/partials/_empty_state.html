{% load onboarding_tags %}<!-- Empty inbox state -->
{% empty_state "inbox" workspace has_channels=social_accounts.exists %}

{% if active_filters.q or active_filters.platform or active_filters.type or active_filters.status or active_filters.sentiment %}
<div class="mx-auto mt-2 max-w-xs border-t border-line pt-4 text-center">
    <p class="mb-2 text-xs text-ink-3">No messages match your current filters.</p>
    <a href="{% url 'inbox:feed' workspace_id=workspace.id %}" class="text-xs font-semibold text-accent hover:underline">Clear all filters</a>
</div>
{% endif %}
