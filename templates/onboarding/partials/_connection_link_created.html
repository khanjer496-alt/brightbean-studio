<!-- HTMX partial returned after creating a connection link -->
<div class="bg-good-soft border border-[rgba(34,197,94,0.15)] rounded-[var(--radius-lg)] py-4 px-5 mb-4">
    <div class="flex items-center gap-2.5 mb-3">
        <svg width="16" height="16" fill="none" stroke="var(--success-500)" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span class="text-sm font-semibold text-good">Connection link created</span>
    </div>

    <!-- Copyable link -->
    <div class="flex flex-wrap gap-2 items-center" x-data="{ copied: false, copyError: false }">
        <input
            type="text"
            value="{{ link_url }}"
            readonly
            id="connection-link-url"
            aria-label="Client connection link"
            x-ref="connectionLink"
            class="flex-1 min-w-0 py-[9px] px-3 text-[0.8125rem] font-[family-name:var(--font-mono)] border-[1.5px] border-line rounded-[var(--radius-lg)] bg-surface-0 text-ink outline-none focus-visible:ring-2 focus-visible:ring-accent"
        >
        <button
            type="button"
            @click="copied = false; copyError = false; Promise.resolve().then(() => navigator.clipboard.writeText($refs.connectionLink.value)).then(() => { copied = true; setTimeout(() => copied = false, 2000); }).catch(() => { copyError = true; $refs.connectionLink.focus(); $refs.connectionLink.select(); })"
            class="py-[9px] px-3.5 text-[0.8125rem] font-semibold bg-surface-0 text-ink border border-line rounded-[var(--radius-lg)] cursor-pointer whitespace-nowrap transition-all duration-150"
        >
            <span x-show="!copied">Copy</span>
            <span x-show="copied" role="status" x-cloak class="text-good">Copied!</span>
        </button>
        <span x-show="copyError" x-cloak role="alert" class="text-xs text-[var(--error-500)]">Copy failed. Select the link and copy it manually.</span>
    </div>

    <p class="text-xs text-ink-3 mt-2">
        Expires {{ link.expires_at|date:"M j, Y" }}. Share this link with your client so they can connect their social accounts.
    </p>
</div>
