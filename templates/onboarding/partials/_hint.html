{% comment %}A first-visit tip. Not modal: it never takes focus, Escape or "Got it" closes it for good.{% endcomment %}
{% if hint %}
<div data-hint="{{ hint.key }}" role="region" aria-label="Tip: {{ hint.title }}"
     x-data @keydown.escape="$refs.close.click()"
     class="relative z-20 mb-3 flex flex-col gap-3 rounded-xl border border-line-strong bg-surface-2 px-4 py-3 sm:flex-row sm:items-center sm:gap-4 {{ extra_class }}">
    <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-ink">{{ hint.title }}</p>
        <p class="mt-0.5 text-sm leading-relaxed text-ink-2">{{ hint.body }}</p>
    </div>
    <button type="button" x-ref="close"
            hx-post="{% url 'onboarding:dismiss_hint' key=hint.key %}"
            hx-target="closest [data-hint]" hx-swap="outerHTML"
            class="min-h-11 shrink-0 cursor-pointer self-start rounded-full bg-accent px-5 sm:self-auto text-sm font-semibold text-white hover:bg-[var(--primary-hover)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Got it</button>
</div>
{% endif %}
