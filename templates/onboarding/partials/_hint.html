{% comment %}A first-visit tip. Not modal: it never takes focus, Escape or "Got it" closes it for good.{% endcomment %}
{% if hint %}
<div data-hint="{{ hint.key }}" role="region" aria-label="Tip: {{ hint.title }}"
     x-data @keydown.escape="$refs.close.click()"
     class="relative z-20 mb-3 w-full max-w-sm self-end rounded-xl border border-line-strong bg-surface-2 p-4 shadow-lg">
    <p class="text-sm font-semibold text-ink">{{ hint.title }}</p>
    <p class="mt-1 text-sm leading-relaxed text-ink-2">{{ hint.body }}</p>
    <button type="button" x-ref="close"
            hx-post="{% url 'onboarding:dismiss_hint' key=hint.key %}"
            hx-target="closest [data-hint]" hx-swap="outerHTML"
            class="mt-3 min-h-11 cursor-pointer rounded-full bg-accent px-5 text-sm font-semibold text-white hover:bg-[var(--primary-hover)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">Got it</button>
</div>
{% endif %}
