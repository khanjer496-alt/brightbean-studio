{% comment %}
Selection checkbox for the bulk-action bar. Expects `pp_id` (a PlatformPost id).
Toggles the `sel` Alpine store. A real <button role="checkbox"> so it is reachable and operable from
the keyboard; `.stop.prevent` keeps a click off any chip link or drag it sits beside.
{% endcomment %}
<button type="button" role="checkbox" aria-label="Select post"
        @click.stop.prevent="$store.sel.toggle('{{ pp_id }}')"
        @mousedown.stop @dragstart.prevent.stop draggable="false"
        class="cal-select-box {{ extra_class }}" :class="$store.sel.has('{{ pp_id }}') && 'is-checked'"
        :aria-checked="$store.sel.has('{{ pp_id }}') ? 'true' : 'false'" aria-checked="false">
    <svg x-show="$store.sel.has('{{ pp_id }}')" x-cloak class="w-2.5 h-2.5" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="4"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
</button>
