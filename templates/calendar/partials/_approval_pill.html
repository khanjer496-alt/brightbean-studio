{% comment %}Approvals filter pill. Vars: pid, label, count. Uses status_filter + workspace from context.{% endcomment %}
<button type="button" hx-get="{% url 'calendar:publish_tab_approvals' workspace_id=workspace.id %}?approval_status={{ pid }}{% if approval_filter_qs %}&{{ approval_filter_qs }}{% endif %}"
        hx-target="#tab-content" hx-swap="innerHTML" aria-pressed="{% if status_filter == pid %}true{% else %}false{% endif %}"
        class="min-h-8 px-3.5 py-1.5 text-[0.8125rem] font-semibold rounded-full transition-colors {% if status_filter == pid %}bg-accent text-white{% else %}text-stone-600 hover:bg-stone-100{% endif %}">
    {{ label }} <span class="{% if status_filter == pid %}opacity-90{% else %}text-stone-500{% endif %}">{{ count }}</span>
</button>
