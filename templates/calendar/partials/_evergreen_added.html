<dialog x-data x-init="$el.showModal()" @close="$el.parentElement.replaceChildren()" @click.self="$el.close()" aria-labelledby="eg-added-title"
        class="m-auto w-[calc(100vw-2rem)] max-w-md rounded-2xl border border-line bg-surface-1 p-0 text-ink backdrop:bg-black/60">
    <div class="p-5">
        <h2 id="eg-added-title" class="text-base font-semibold text-ink">Added to evergreen</h2>
        <p class="mt-1 text-sm text-ink-3" role="status">It can go out again after {{ item.interval_days }} day{{ item.interval_days|pluralize }}, when a queue slot is free.</p>
        <div class="mt-4 flex items-center justify-end gap-2">
            <button type="button" autofocus class="min-h-9 text-sm text-stone-600 hover:text-stone-800 py-2 px-3 cursor-pointer" @click="$el.closest('dialog').close()">Close</button>
            <a href="{% url 'calendar:evergreen_detail' workspace_id=workspace.id item_id=item.id %}" class="btn-brand text-sm py-2 px-4">View in library</a>
        </div>
    </div>
</dialog>
