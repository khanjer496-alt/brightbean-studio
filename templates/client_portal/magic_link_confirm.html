{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to {{ workspace.name }} · {{ brand_name }}</title>
    <link rel="icon" href="{% static brand_favicon_ico_static %}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{% static brand_favicon_static %}">
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'favicon/favicon-96x96.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static brand_apple_touch_icon_static %}">
    <link rel="manifest" href="{% static brand_manifest_static %}">
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>
<body class="min-h-dvh flex items-center justify-center px-4 bg-[color:var(--surface-1)] font-[family-name:var(--font-body)]">
    <div class="w-full max-w-sm text-center">
        <div class="rounded-2xl border p-8 bg-[color:var(--surface-0)] border-[color:var(--border)] shadow-[var(--shadow-lg)]">
            <!-- Icon -->
            <div class="w-14 h-14 mx-auto rounded-2xl flex items-center justify-center mb-5 bg-[color:var(--primary-soft)]">
                <svg class="w-7 h-7 text-[color:var(--primary)]" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H2.25"/></svg>
            </div>

            <h1 class="text-lg font-bold tracking-tight mb-2 text-[color:var(--text-primary)] font-[family-name:var(--font-display)]">
                Sign in to {{ workspace.name }}
            </h1>
            <p class="text-sm leading-relaxed mb-6 text-[color:var(--text-secondary)]">
                Continue to review and approve scheduled posts for {{ workspace.name }}.
            </p>

            <form method="post" action="{% url 'client_portal:magic_link_entry' token=token %}">
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <button type="submit" class="btn-brand btn-brand--block">
                    Continue to portal
                </button>
            </form>
        </div>
    </div>
</body>
</html>
