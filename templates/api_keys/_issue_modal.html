{% comment %}
Issuance modal — Alpine for open/close, HTMX for the cascading workspace
→ accounts + permissions partial. The actual POST is a normal Django
form submit (no HTMX); the token is then shown once on the redirected list page.
{% endcomment %}
<template x-teleport="body">
    <div x-show="showIssueModal" x-cloak x-transition.opacity
         class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
         role="dialog" aria-modal="true" aria-labelledby="issue-key-title" x-pd-dialog="showIssueModal">
        <div @click.outside="showIssueModal = false"
             x-show="showIssueModal" x-transition
             class="w-full max-w-xl mx-4 max-h-[90vh] rounded-xl flex flex-col bg-[var(--surface-0)] border border-stone-200 shadow-2xl">
            <form method="POST" action="{% url 'api_keys:issue' %}" data-token-scope class="flex flex-col min-h-0">
                {% csrf_token %}
                <div class="flex items-start justify-between gap-4 px-5 sm:px-6 pt-6 pb-4 flex-shrink-0">
                    <div>
                        <h3 id="issue-key-title" class="text-lg font-semibold text-[var(--text-primary)]">Issue an agent token</h3>
                        <p class="text-xs mt-1 text-[var(--text-tertiary)]">The token is shown <strong>once</strong>, right after you create it.</p>
                    </div>
                    <button type="button" @click="showIssueModal = false" aria-label="Close" class="text-xl leading-none px-2 cursor-pointer text-[var(--text-tertiary)]">&times;</button>
                </div>

                <div class="space-y-5 px-5 sm:px-6 overflow-y-auto flex-1 min-h-0">
                    <div>
                        <label for="name" class="block text-sm font-semibold mb-1 text-[var(--text-primary)]">Name</label>
                        <input type="text" id="name" name="name" required data-autofocus maxlength="100" autocomplete="off"
                               placeholder="e.g. Claude Desktop, content pipeline" class="form-input text-sm w-full">
                    </div>

                    <div>
                        <label for="workspace_id" class="block text-sm font-semibold mb-1 text-[var(--text-primary)]">Workspace</label>
                        <select id="workspace_id" name="workspace_id" required
                                hx-get="{% url 'api_keys:workspace_options' %}"
                                hx-trigger="change"
                                hx-target="#workspace-options-target"
                                hx-include="this"
                                class="form-input text-sm w-full">
                            <option value="">Pick a workspace…</option>
                            {% for ws in issuance.workspaces %}
                            <option value="{{ ws.id }}">{{ ws.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    {# Populated by HTMX once a workspace is picked. #}
                    <div id="workspace-options-target" class="space-y-4"></div>

                    {% include "api_keys/_scope_fields.html" with scope_form=scope_form uid="issue" %}

                    <div>
                        <label for="expires_at" class="block text-sm font-semibold mb-1 text-[var(--text-primary)]">
                            Expires on <span class="font-normal text-[var(--text-tertiary)]">(optional)</span>
                        </label>
                        <input type="date" id="expires_at" name="expires_at" class="form-input text-sm w-full">
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 px-5 sm:px-6 pt-5 pb-6 flex-shrink-0">
                    <button type="button" @click="showIssueModal = false"
                            class="px-4 py-2 text-sm font-medium rounded-full cursor-pointer border border-stone-300 bg-white text-stone-700 hover:bg-stone-50">Cancel</button>
                    <button type="submit" class="btn-brand text-sm py-2 px-5">Create token</button>
                </div>
            </form>
        </div>
    </div>
</template>
