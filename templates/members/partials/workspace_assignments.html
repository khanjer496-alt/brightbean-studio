<!-- Workspace Assignment Form (loaded via HTMX into modal) -->
<form hx-post="{% url 'members:manage_workspaces' membership_id=membership.id %}"
      hx-target="#member-{{ membership.id }}"
      hx-swap="outerHTML">
    {% csrf_token %}

    <div class="space-y-2 max-h-64 overflow-y-auto mb-4">
        {% for wd in workspace_data %}
        <div class="flex flex-wrap items-center gap-3 py-2 px-3 rounded-lg bg-surface-2">
            <input type="checkbox" name="ws_{{ wd.workspace.id }}" value="1"
                   id="assign-ws-{{ wd.workspace.id }}"
                   {% if wd.assigned %}checked{% endif %}
                   class="w-4 h-4 accent-accent cursor-pointer">
            <label for="assign-ws-{{ wd.workspace.id }}" class="flex-1 text-sm cursor-pointer text-ink">
                {{ wd.workspace.name }}
            </label>
            <select name="ws_role_{{ wd.workspace.id }}" aria-label="Role in {{ wd.workspace.name }}"
                    class="text-xs px-2 py-1 rounded border outline-none focus-visible:ring-2 focus-visible:ring-accent border-line bg-surface-0 text-ink">
                {% for value, label in workspace_role_choices %}
                <option value="{{ value }}" {% if value == wd.current_role %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        {% empty %}
        <p class="text-sm text-ink-3">No workspaces available.</p>
        {% endfor %}
    </div>

    <div class="flex justify-end">
        <button type="submit"
                class="btn-opacity px-5 py-2 text-sm font-medium rounded-full cursor-pointer transition-colors bg-accent text-white focus-visible:ring-2 focus-visible:ring-accent">
            Save Assignments
        </button>
    </div>
</form>
