{# One AI-written caption, with buttons to put it in the composer's caption. #}
<div class="mt-3 rounded-lg border border-stone-200 bg-stone-50 p-3">
    <p class="text-[11px] font-semibold text-stone-400 uppercase tracking-wider mb-1">{{ heading }}</p>
    <p class="text-sm text-stone-700 whitespace-pre-line break-words">{{ text }}</p>
    <div class="flex gap-2 mt-3">
        <button type="button" class="btn-brand text-xs py-1.5 px-3"
                data-text="{{ text }}"
                @click="applyAICaption($el.dataset.text); aiOpen = false">
            Use this caption
        </button>
        <button type="button"
                class="text-xs font-semibold py-1.5 px-3 rounded-full border border-stone-200 text-stone-500 hover:border-stone-300 hover:text-stone-700 transition-colors whitespace-nowrap"
                data-text="{{ text }}"
                @click="appendToCaption($el.dataset.text); aiOpen = false">
            Add below
        </button>
    </div>
</div>
