{% extends "base.html" %}

{% block page_title %}Dashboard{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-200px)]">
    <div class="max-w-[480px] text-center px-6">
        <!-- Icon -->
        <div class="rounded-xl size-16 mx-auto mb-6 bg-accent-soft border-[1.5px] border-[var(--primary-muted)] flex items-center justify-center">
            <svg width="28" height="28" fill="none" stroke="var(--primary)" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
        </div>

        <!-- Heading -->
        <h2 class="text-ink font-[family-name:var(--font-display)] text-[1.75rem] font-bold tracking-[-0.015em] mb-2">No workspaces yet</h2>

        <p class="text-ink-2 text-[0.9375rem] leading-[1.7] mb-8">Create a workspace to start scheduling posts, managing content, and collaborating with your team.</p>

        <!-- Create workspace form -->
        <form class="bg-surface-0 border border-line rounded-xl p-6 shadow-[var(--shadow-sm)] text-left" method="post" action="{% url 'workspaces:create' %}">
            {% csrf_token %}
            <label for="new-workspace-name" class="text-ink block text-[0.8125rem] font-semibold mb-1.5">Workspace name</label>
            <input
                type="text"
                name="name"
                id="new-workspace-name"
                placeholder="e.g. My Brand, Client Name"
                required
                class="form-input-styled mb-4"
            >
            <button type="submit" class="btn-brand">
                Create Workspace
            </button>
        </form>
    </div>
</div>
{% endblock %}
