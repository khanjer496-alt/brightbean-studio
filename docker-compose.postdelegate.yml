# Standalone PostDelegate lean-beta stack for the BrightBean migration spike.
# Deliberately does not inherit BrightBean's development Compose ports/env file.

x-postdelegate-app: &postdelegate-app
  image: postdelegate-app:${POSTDELEGATE_IMAGE_TAG:-spike}
  build: .
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  env_file:
    - ${POSTDELEGATE_ENV_FILE:-.env.postdelegate}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: postgres://postdelegate:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/postdelegate

services:
  migrate:
    <<: *postdelegate-app
    command: python manage.py migrate --noinput
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *postdelegate-app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://postdelegate:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/postdelegate
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': __import__('os').environ['ALLOWED_HOSTS'].split(',')[0]}); urllib.request.urlopen(r, timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *postdelegate-app
    command: python manage.py process_tasks
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.path.getmtime('/tmp/postdelegate-publisher-heartbeat') < 1200"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postdelegate
      POSTGRES_USER: postdelegate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postdelegate -d postdelegate -q"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${POSTDELEGATE_DOMAIN:-app.postdelegate.com}
    ports:
      - "${POSTDELEGATE_HTTP_PORT:-80}:80"
      - "${POSTDELEGATE_HTTPS_PORT:-443}:443"
      - "${POSTDELEGATE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
