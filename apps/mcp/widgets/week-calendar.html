<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week calendar</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --surface: #f6f6f3;
  --text: #14161c;
  --muted: #5b6070;
  --border: #dcdde3;
  --accent: #5a3fe0;
  --ok: #1a7f4b;
  --warn: #9a5b00;
  --bad: #b3261e;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1016;
    --surface: #171a22;
    --text: #f1f2f6;
    --muted: #a3a8b8;
    --border: #2b2f3b;
    --accent: #a597ff;
    --ok: #5fd397;
    --warn: #f0b45a;
    --bad: #ff8a80;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
h1, h2 { margin: 0; font-size: 15px; font-weight: 650; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.stack > * + * { margin-top: 10px; }
.caption { white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
.chip {
  display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px;
  border: 1px solid var(--border); font-size: 12px; background: var(--bg); color: var(--muted);
}
.chip[data-tone="ok"] { color: var(--ok); border-color: currentColor; }
.chip[data-tone="warn"] { color: var(--warn); border-color: currentColor; }
.chip[data-tone="bad"] { color: var(--bad); border-color: currentColor; }
.notice { border-inline-start: 3px solid var(--warn); padding: 6px 10px; margin-top: 10px; background: var(--bg); border-radius: 6px; }
.empty { padding: 24px 8px; text-align: center; color: var(--muted); }
button {
  font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--accent);
  border-radius: 8px; padding: 4px 12px; cursor: pointer;
}
button:hover { background: var(--bg); }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px; min-height: 96px; min-width: 0; }
.day h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.day[data-today="true"] h2 { color: var(--accent); }
.slot { font-size: 12px; margin-top: 4px; padding: 3px 5px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 520px) {
  .week { grid-template-columns: 1fr; }
  .day { min-height: 0; }
}
.mt { margin-top: 10px; }
.mb { margin-bottom: 8px; }
.plain-list { list-style: none; padding: 0; margin: 10px 0 0; }
</style>
</head>
<body>
<main id="root" aria-live="polite"></main>
<script>
/* PostDelegate widget runtime: the MCP Apps bridge (JSON-RPC over postMessage) and small pure helpers.
   Every value that came from a tool result is untrusted and is only ever written with textContent. */
var Pd = (function () {
  var pending = {};
  var nextId = 1;

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === "text") node.textContent = String(attrs[key]);
      else node.setAttribute(key, String(attrs[key]));
    });
    (children || []).forEach(function (child) {
      if (child) node.appendChild(child);
    });
    return node;
  }

  function parseDate(value) {
    if (!value) return null;
    var d = new Date(value);
    return isNaN(d.getTime()) ? null : d;
  }

  function formatWhen(value) {
    var d = parseDate(value);
    if (!d) return "Not scheduled";
    return d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function dayKey(d) {
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  /* The Monday (local time) of the week containing ``d``. */
  function weekStart(d) {
    var start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
    return start;
  }

  function postDate(post) {
    return parseDate(post.scheduled_at) || parseDate(post.published_at) || parseDate(post.proposed_publish_at);
  }

  /* Seven days starting on ``start``, each with the posts that fall on it, earliest first. Posts outside the
     week are returned in ``outside`` so the widget can say how many it left out. */
  function groupByWeek(posts, start) {
    var days = [];
    for (var i = 0; i < 7; i++) {
      var day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      days.push({ date: day, key: dayKey(day), posts: [] });
    }
    var byKey = {};
    days.forEach(function (day) { byKey[day.key] = day; });
    var outside = 0;
    (posts || []).forEach(function (post) {
      var when = postDate(post);
      var day = when && byKey[dayKey(when)];
      if (day) day.posts.push({ post: post, when: when });
      else outside += 1;
    });
    days.forEach(function (day) { day.posts.sort(function (a, b) { return a.when - b.when; }); });
    return { days: days, outside: outside };
  }

  /* The week to show: the one with the most posts in it (the earliest on a tie), so a result that is not about
     "this week" still opens on something. */
  function pickWeek(posts) {
    var counts = {};
    var starts = {};
    (posts || []).forEach(function (post) {
      var when = postDate(post);
      if (!when) return;
      var start = weekStart(when);
      var key = dayKey(start);
      counts[key] = (counts[key] || 0) + 1;
      starts[key] = start;
    });
    var best = null;
    Object.keys(counts).forEach(function (key) {
      if (!best || counts[key] > counts[best] || (counts[key] === counts[best] && starts[key] < starts[best])) best = key;
    });
    return best ? starts[best] : weekStart(new Date());
  }

  function tone(status) {
    if (status === "published") return "ok";
    if (status === "failed" || status === "rejected") return "bad";
    if (/pending|changes|held|on_hold|draft/.test(status || "")) return "warn";
    return "";
  }

  function label(status) {
    return String(status || "unknown").replace(/_/g, " ");
  }

  function chip(status) {
    return el("span", { class: "chip", "data-tone": tone(status), text: label(status) });
  }

  function send(message) {
    window.parent.postMessage(Object.assign({ jsonrpc: "2.0" }, message), "*");
  }

  function request(method, params) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending[id] = { resolve: resolve, reject: reject };
      send({ id: id, method: method, params: params });
    });
  }

  function followUp(text) {
    if (window.openai && typeof window.openai.sendFollowUpMessage === "function") {
      return window.openai.sendFollowUpMessage({ prompt: text });
    }
    return request("ui/message", { role: "user", content: { type: "text", text: text } });
  }

  function reportSize() {
    send({
      method: "ui/notifications/size-changed",
      params: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight },
    });
  }

  /* Calls ``render(structuredContent)`` now and on every new tool result. */
  function start(render) {
    function show(data) {
      render(data && typeof data === "object" ? data : {});
      reportSize();
    }
    window.addEventListener("message", function (event) {
      if (event.source !== window.parent) return;
      var msg = event.data;
      if (!msg || msg.jsonrpc !== "2.0") return;
      if (msg.method === "ui/notifications/tool-result") {
        show(msg.params && msg.params.structuredContent);
      } else if (msg.id !== undefined && pending[msg.id]) {
        var entry = pending[msg.id];
        delete pending[msg.id];
        if (msg.error) entry.reject(msg.error);
        else entry.resolve(msg.result);
      }
    });
    window.addEventListener("openai:set_globals", function (event) {
      var globals = event.detail && event.detail.globals;
      if (globals && globals.toolOutput) show(globals.toolOutput);
    });
    if (window.openai && window.openai.toolOutput) show(window.openai.toolOutput);
    else show({});
    request("ui/initialize", {
      protocolVersion: "2025-06-18",
      appInfo: { name: "postdelegate-widget", version: "1.0.0" },
      appCapabilities: {},
    })
      .then(function () { send({ method: "ui/notifications/initialized", params: {} }); })
      .catch(function () {});
    if (typeof ResizeObserver === "function") new ResizeObserver(reportSize).observe(document.body);
  }

  return {
    el: el, parseDate: parseDate, formatWhen: formatWhen, weekStart: weekStart, postDate: postDate,
    groupByWeek: groupByWeek, pickWeek: pickWeek, tone: tone, label: label, chip: chip,
    followUp: followUp, start: start,
  };
})();
if (typeof module !== "undefined") module.exports = Pd;
</script>
<script>
(function () {
  var el = Pd.el;
  var root = document.getElementById("root");

  function render(data) {
    root.textContent = "";
    var posts = (data && data.posts) || [];
    if (!posts.length) {
      root.appendChild(el("p", { class: "empty", text: "No posts in this range." }));
      return;
    }
    var week = Pd.groupByWeek(posts, Pd.pickWeek(posts));
    var first = week.days[0].date;
    var last = week.days[6].date;
    var range = first.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " to " +
      last.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    root.appendChild(el("div", { class: "row mb" }, [
      el("h1", { text: "Week of " + range }),
      el("span", { class: "muted", text: posts.length - week.outside + " posts" }),
    ]));
    var now = new Date();
    var todayKey = now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
    var grid = el("div", { class: "week", role: "list" }, week.days.map(function (day) {
      var slots = day.posts.map(function (entry) {
        var time = entry.when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
        var text = time + " " + (entry.post.title || entry.post.caption || "Post");
        return el("div", { class: "slot", tabindex: "0", title: text, text: text });
      });
      var heading = day.date.toLocaleDateString(undefined, { weekday: "short", day: "numeric" });
      return el("section", { class: "day", role: "listitem", "data-today": String(day.key === todayKey) },
        [el("h2", { text: heading })].concat(slots));
    }));
    root.appendChild(grid);
    if (week.outside) {
      root.appendChild(el("p", { class: "muted", text: week.outside + " more post(s) fall in other weeks." }));
    }
  }

  Pd.start(render);
})();
</script>
</body>
</html>
